rules:
  - id: hardcoded-secret-assignment
    languages: [java]
    severity: ERROR
    message: >
      비밀번호/API 키/시크릿으로 보이는 변수에 문자열 리터럴이 직접
      대입되었습니다. 키/시크릿은 코드와 분리해 환경 변수나 시크릿 매니저로
      관리해야 합니다.
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
    patterns:
      - pattern: String $SECRET = "$VALUE";
      - metavariable-regex:
          metavariable: $SECRET
          regex: (?i)(password|secret|apikey|api_key|privatekey|private_key|token)
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^.+$
