rules:
  - id: cookie-missing-httponly
    languages: [java]
    severity: ERROR
    message: >
      쿠키 생성 체인에 httpOnly(true) 설정이 없습니다. 인증·세션 관련
      쿠키는 자바스크립트로 접근하지 못하도록 httpOnly를 반드시 켜야 합니다.
    metadata:
      category: security
      cwe: "CWE-1004: Sensitive Cookie Without 'HttpOnly' Flag"
    patterns:
      - pattern: ResponseCookie.from(...). ... .build()
      - pattern-not: ResponseCookie.from(...). ... .httpOnly(true). ... .build()

  - id: cookie-missing-secure
    languages: [java]
    severity: ERROR
    message: >
      쿠키 생성 체인에 secure(true) 설정이 없습니다. 인증·세션 관련
      쿠키는 HTTPS 연결에서만 전송되도록 secure를 반드시 켜야 합니다.
    metadata:
      category: security
      cwe: "CWE-614: Sensitive Cookie in HTTPS Session Without 'Secure' Attribute"
    patterns:
      - pattern: ResponseCookie.from(...). ... .build()
      - pattern-not: ResponseCookie.from(...). ... .secure(true). ... .build()

  - id: servlet-cookie-missing-flags
    languages: [java]
    severity: ERROR
    message: >
      jakarta.servlet.http.Cookie를 생성한 뒤 setHttpOnly(true)/setSecure(true)를
      호출하지 않았습니다. 인증·세션 관련 쿠키는 두 플래그를 모두 켜야 합니다.
    metadata:
      category: security
      cwe: "CWE-1004: Sensitive Cookie Without 'HttpOnly' Flag"
    patterns:
      - pattern: $C = new Cookie(...);
      - pattern-not-inside: |
          $C = new Cookie(...);
          ...
          $C.setHttpOnly(true);
          ...
          $C.setSecure(true);
          ...
