rules:
  - id: weak-hash-algorithm
    languages: [java]
    severity: ERROR
    message: >
      MD5/SHA-1은 취약한 해시 알고리즘입니다. 비밀번호 해시는
      Argon2id > scrypt > bcrypt(Work Factor 10+) > PBKDF2-HMAC-SHA256(60만 회+)
      우선순위를 따라야 하고, 무결성 검증 용도라도 SHA-256 이상을 사용해야 합니다.
    metadata:
      category: security
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
    patterns:
      - pattern-either:
          - pattern: MessageDigest.getInstance("MD5")
          - pattern: MessageDigest.getInstance("SHA-1")
          - pattern: MessageDigest.getInstance("SHA1")

  - id: weak-cipher-mode
    languages: [java]
    severity: ERROR
    message: >
      ECB 모드 또는 DES는 금지된 암호화 방식입니다. 대칭키 암호화는
      AES-128비트 이상(256비트 권장)의 GCM 또는 CCM 모드만 사용해야 합니다.
    metadata:
      category: security
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
    patterns:
      - pattern-either:
          - pattern: Cipher.getInstance("AES/ECB/$PADDING")
          - pattern: Cipher.getInstance("DES")
          - pattern: Cipher.getInstance("DES/$MODE/$PADDING")
