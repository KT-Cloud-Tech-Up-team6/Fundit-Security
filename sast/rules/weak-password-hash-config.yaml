rules:
  - id: bcrypt-weak-work-factor
    languages: [java]
    severity: ERROR
    message: >
      BCryptPasswordEncoder의 Work Factor가 10 미만입니다. 비밀번호 해시는
      bcrypt 사용 시 Work Factor 10 이상을 권장합니다(인자 없이 생성하면
      Spring Security 기본값인 10이 적용되어 안전합니다).
    metadata:
      category: security
      cwe: "CWE-916: Use of Password Hash With Insufficient Computational Effort"
    patterns:
      - pattern: new BCryptPasswordEncoder($N)
      - metavariable-comparison:
          metavariable: $N
          comparison: $N < 10
