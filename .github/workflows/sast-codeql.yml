name: SAST - CodeQL (Fundit-backend)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sast-codeql.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sast-codeql.yml'
  schedule:
    - cron: '0 4 * * 1' # 매주 월요일 04:00 UTC(한국시간 13:00) 전체 재스캔
  workflow_dispatch: {}

jobs:
  analyze:
    name: Analyze Fundit-backend (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout Fundit-backend (develop)
        uses: actions/checkout@v7
        with:
          repository: KT-Cloud-Tech-Up-team6/Fundit-backend
          ref: develop
          path: target-repo
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: target-repo/**/*.gradle*

      - name: Grant execute permission for gradlew
        run: chmod +x target-repo/gradlew

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: autobuild # Lombok 어노테이션 프로세싱 때문에 none 대신 사용
          queries: security-extended
          source-root: target-repo

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
          output: sarif-results # upload와 별개로 로컬 사본도 아티팩트용으로 남긴다

      - name: Upload SARIF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sast-results
          path: sarif-results
          retention-days: 30
