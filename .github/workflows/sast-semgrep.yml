name: SAST - Semgrep (Fundit-backend)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sast-semgrep.yml'
      - 'sast/rules/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sast-semgrep.yml'
      - 'sast/rules/**'
  schedule:
    - cron: '0 4 * * 1' # 매주 월요일 04:00 UTC(한국시간 13:00) 전체 재스캔
  workflow_dispatch: {}

jobs:
  semgrep:
    name: Scan Fundit-backend (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout Fundit-backend (develop)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: KT-Cloud-Tech-Up-team6/Fundit-backend
          ref: develop
          path: target-repo
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/java \
            --config p/security-audit \
            --config p/secrets \
            --config p/jwt \
            --config sast/rules \
            --sarif --output semgrep-results.sarif \
            target-repo

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      - name: Upload SARIF as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-sast-results
          path: semgrep-results.sarif
          retention-days: 30
